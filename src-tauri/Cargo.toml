[package]
name = "larpscord"
version = "1.2.0"
description = "Larpscord — студия настройки Discord Rich Presence"
authors = ["Larpscord"]
license = "MIT"
repository = "https://github.com/PREDATTORRGGDR/larpscord"
edition = "2021"
rust-version = "1.77"

[lib]
name = "larpscord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.4"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "6.0"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
interprocess = { version = "2.4", features = ["tokio"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Media_Control",
    "Storage_Streams",
    "Storage",
    "Foundation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
